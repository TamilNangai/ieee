<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body {
             margin: 0;
            padding: 0;
            background: url(https://static.vecteezy.com/system/resources/previews/004/194/259/non_2x/doodle-math-objects-border-free-vector.jpg) no-repeat center/cover;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}
h1{
    margin-top: 20px;
    font-size: 100px;
    color: white;
}
.calculator {
    display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #5e5e5e;
   backdrop-filter: blur(40px);
  padding: 30px;
  border-radius: 30px;
}

#display {
    
  background: #9dd054;
   border: 1px solid rgb(48, 179, 91); 
  width: 100%;
  height: 45px;
  font-size: 20px;
  text-align: right;
  margin: 20px 10px;
  margin-bottom: 30px;
  padding: 5px;
  border-radius:20px
}
#display:focus{
            border: 1px solid #9dd054;
            transform: scale(1.01) translate(-0.2rem);
            appearance: none;
            outline: none;
             box-shadow:0px 0px 10px #9dd054;
        }

.buttons {
    width: 100%;
    height: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
   grid-auto-rows: 50px;
  gap: 10px;
}

button {
  width: 100%;
  height: 100%;
  font-size: 18px;
  cursor: pointer;
  
  border-radius: 20px;
  
  box-shadow: 5px 5px 5px rgb(60, 60, 60);
   transition: all 0.2s ease;
}

.zero {
  grid-column: span 2;
  background-color: rgb(24, 24, 24);
  color: white;
}
.plus {
  grid-row:span 2;
}
.equal {
  grid-row:span 2;
}
.clear{
    background-color: rgb(255, 67, 67);
}

.calculator:hover{
            box-shadow:0px 0px 10px #000000;
            transform: scale(1.01) translate(-0.2rem);
        }
#display:hover{
            box-shadow:0px 0px 10px #9dd054;
            transform: scale(1.01) translate(-0.2rem);
        }
.num{
    color: white;
    background-color: rgb(24, 24, 24);
}

    </style>
</head>

<body>
    <h1>Calculator</h1>

    <div class="calculator">
        <input type="text" id="display" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="append('/')">÷</button>
            <button onclick="append('*')">×</button>
            <button onclick="append('-')">−</button>

            <button class="num" onclick="append('7')">7</button>
            <button class="num" onclick="append('8')">8</button>
            <button class="num" onclick="append('9')">9</button>
            <button class="plus" onclick="append('+')">+</button>

            <button class="num" onclick="append('4')">4</button>
            <button class="num" onclick="append('5')">5</button>
            <button class="num" onclick="append('6')">6</button>

            <button class="num" onclick="append('1')">1</button>
            <button class="num" onclick="append('2')">2</button>
            <button class="num" onclick="append('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="zero" onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

            function append(value) {
                display.value += value;
            }

            function clearDisplay() {
                display.value = "";
            }

            function calculate() {
                try {
                    display.value = eval(display.value);
                } catch {
                    display.value = "Error";
                }
            }

    </script>
</body>

</html>
